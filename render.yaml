services:
  # Web Service (Backend + Frontend)
  - type: web
    name: routing-service
    env: node
    region: oregon
    plan: starter
    branch: claude/intelligent-routing-service-011CUM2Tizir16Z1wrYo3KCY
    buildCommand: npm ci && npm run build && cd client && npm ci && npm run build && cd ..
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_ROUTES_PER_DAY
        value: 50
      - key: MAX_STOPS_PER_ROUTE
        value: 25
      - key: DEFAULT_SERVICE_DURATION_MINUTES
        value: 60
      - key: GPS_UPDATE_INTERVAL_MS
        value: 30000
      - key: DATABASE_URL
        fromDatabase:
          name: routing-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  # PostgreSQL Database
  - type: postgres
    name: routing-db
    region: oregon
    plan: starter
    databaseName: routing_db
    databaseUser: routing_user
    ipAllowList: []
